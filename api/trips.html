<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trip History</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #111827;
            color: #f9fafb;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .title-group h1 {
            margin: 0 0 6px 0;
            font-size: 32px;
        }

        .subtitle {
            color: #9ca3af;
        }

        .nav-link {
            color: #f9fafb;
            text-decoration: none;
            background: #1f2937;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .nav-link:hover {
            background: #374151;
        }

        .layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 24px;
            align-items: start;
        }

        .panel {
            background: #1f2937;
            border-radius: 12px;
            padding: 20px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .trip-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .trip-item {
            width: 100%;
            text-align: left;
            background: #111827;
            color: #f9fafb;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
        }

        .trip-item:hover {
            border-color: #6b7280;
        }

        .trip-item.active {
            background: #243554;
            border-color: #60a5fa;
            box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.18);
        }

        .trip-vehicle {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .trip-time,
        .trip-details {
            color: #9ca3af;
            font-size: 13px;
        }

        .trip-details {
            margin-top: 5px;
        }

        .placeholder {
            color: #9ca3af;
            padding: 30px 0;
        }

        .detail-header {
            margin-bottom: 20px;
        }

        .detail-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .detail-subtitle {
            color: #9ca3af;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        .summary-card {
            background: #111827;
            border-radius: 10px;
            padding: 16px;
        }

        .summary-label {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .summary-value {
            font-size: 22px;
            font-weight: 700;
        }


        :root {
            --powertrain: #38bdf8;
            --thermal: #fb923c;
            --airflow: #34d399;
            --electrical: #a78bfa;
        }

        .chart-card.powertrain {
            border-top: 3px solid var(--powertrain);
        }

        .chart-card.thermal {
            border-top: 3px solid var(--thermal);
        }

        .chart-card.airflow {
            border-top: 3px solid var(--airflow);
        }

        .chart-card.electrical {
            border-top: 3px solid var(--electrical);
        }

        .chart-card.powertrain .chart-title {
            color: var(--powertrain);
        }

        .chart-card.thermal .chart-title {
            color: var(--thermal);
        }

        .chart-card.airflow .chart-title {
            color: var(--airflow);
        }

        .chart-card.electrical .chart-title {
            color: var(--electrical);
        }

        .charts {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .chart-card {
            background: #111827;
            border-radius: 10px;
            padding: 18px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
        }


        .chart-axis-unit {
            margin: 2px 0 3px 2px;
            color: #9ca3af;
            font-size: 12px;
            font-weight: 600;
            line-height: 1;
        }

        .chart-wrapper {
            height: 260px;
            position: relative;
        }

        .health {
            margin-top: 24px;
        }

        .health-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 10px 0;
            border-bottom: 1px solid #374151;
        }

        .health-row:last-child {
            border-bottom: none;
        }

        .health-label {
            color: #d1d5db;
        }


        .alarm-section {
            margin-top: 24px;
        }

        .alarm-summary {
            display: grid;
            grid-template-columns: repeat(3, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .alarm-count-card {
            background: #111827;
            border-radius: 10px;
            padding: 14px;
        }

        .alarm-count-label {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .alarm-count-value {
            font-size: 22px;
            font-weight: 700;
        }

        .alarm-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .alarm-event {
            background: #111827;
            border: 1px solid #374151;
            border-left-width: 4px;
            border-radius: 10px;
            padding: 14px 16px;
        }

        .alarm-event.triggered {
            border-left-color: #f59e0b;
        }

        .alarm-event.cleared {
            border-left-color: #10b981;
        }

        .alarm-event-top {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .alarm-event-title {
            font-weight: 700;
        }

        .alarm-event-time {
            color: #9ca3af;
            font-size: 13px;
            white-space: nowrap;
        }

        .alarm-event-meta {
            color: #d1d5db;
            font-size: 13px;
            line-height: 1.6;
        }

        .alarm-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .alarm-badge.triggered {
            background: rgba(245, 158, 11, 0.16);
            color: #fbbf24;
        }

        .alarm-badge.cleared {
            background: rgba(16, 185, 129, 0.16);
            color: #34d399;
        }

        .alarm-badge.warning {
            background: rgba(245, 158, 11, 0.16);
            color: #fbbf24;
        }

        .alarm-badge.critical {
            background: rgba(239, 68, 68, 0.18);
            color: #fca5a5;
        }

        .alarm-event-phase {
            margin-top: 6px;
        }

        .alarm-event-phase:first-child {
            margin-top: 0;
        }

        .alarm-event-phase-label {
            font-weight: 700;
            color: #f9fafb;
        }


        .playback-panel {
            margin-bottom: 24px;
            padding: 18px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 10px;
        }

        .playback-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
        }

        .playback-title {
            font-size: 16px;
            font-weight: 700;
        }

        .playback-state {
            color: #93c5fd;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .playback-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .playback-button,
        .playback-speed,
        .playback-link {
            border: 1px solid #4b5563;
            border-radius: 8px;
            padding: 9px 12px;
            background: #1f2937;
            color: #f9fafb;
            font: inherit;
        }

        .playback-button,
        .playback-link {
            cursor: pointer;
        }

        .playback-button:hover:not(:disabled),
        .playback-link:hover {
            background: #374151;
        }

        .playback-button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        .playback-link {
            margin-left: auto;
            text-decoration: none;
        }

        .playback-progress {
            height: 8px;
            margin-top: 14px;
            overflow: hidden;
            background: #1f2937;
            border-radius: 999px;
        }

        .playback-progress-fill {
            width: 0%;
            height: 100%;
            background: #60a5fa;
            transition: width 0.2s ease;
        }

        .playback-progress-text {
            margin-top: 8px;
            color: #9ca3af;
            font-size: 13px;
        }

        .playback-error {
            margin-top: 10px;
            color: #fca5a5;
            font-size: 13px;
        }

        @media (max-width: 1000px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .summary-grid,
            .alarm-summary {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 18px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .summary-grid,
            .alarm-summary,
            .charts {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="topbar">
            <div class="title-group">
                <h1>Trip History</h1>

                <div class="subtitle">
                    Recorded vehicle telemetry sessions
                </div>
            </div>

            <a class="nav-link" href="/dashboard">
                Live Telemetry
            </a>
        </div>

        <div class="layout">

            <div class="panel">
                <div class="panel-title">
                    Recorded Trips
                </div>

                <div id="trip-list" class="trip-list">
                    <div class="placeholder">
                        Loading trips...
                    </div>
                </div>
            </div>

            <div class="panel">
                <div id="trip-detail">
                    <div class="placeholder">
                        Select a trip to view details.
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        let rpmChart = null;
        let speedChart = null;
        let throttleChart = null;
        let loadChart = null;
        let coolantChart = null;
        let oilTempChart = null;
        let mafChart = null;
        let mapChart = null;
        let selectedTripId = null;
        let playbackPollTimer = null;


        const TELEMETRY_FIELD_META = {
            rpm: {
                canvasId: "rpm-history-chart",
                label: "RPM",
                unit: ""
            },
            speed_mph: {
                canvasId: "speed-history-chart",
                label: "Speed",
                unit: " mph"
            },
            throttle_pct: {
                canvasId: "throttle-history-chart",
                label: "Throttle",
                unit: "%"
            },
            load_pct: {
                canvasId: "load-history-chart",
                label: "Engine Load",
                unit: "%"
            },
            coolant_temp_f: {
                canvasId: "coolant-history-chart",
                label: "Coolant Temperature",
                unit: "°F"
            },
            oil_temp_f: {
                canvasId: "oil-temp-history-chart",
                label: "Oil Temperature",
                unit: "°F"
            },
            maf_gps: {
                canvasId: "maf-history-chart",
                label: "Mass Air Flow",
                unit: " g/s"
            },
            manifold_pressure_kpa: {
                canvasId: "map-history-chart",
                label: "Manifold Pressure",
                unit: " kPa"
            }
        };


        function formatVehicle(vehicle) {
            if (
                !vehicle ||
                !vehicle.year ||
                !vehicle.make ||
                !vehicle.model
            ) {
                return "Unknown Vehicle";
            }

            const make = vehicle.make
                .toLowerCase()
                .replace(
                    /\b\w/g,
                    character => character.toUpperCase()
                );

            return `${vehicle.year} ${make} ${vehicle.model}`;
        }


        function formatDateTime(timestamp) {
            if (!timestamp) {
                return "Unknown time";
            }

            const date = new Date(timestamp);

            return date.toLocaleString();
        }


        function formatDuration(seconds) {
            if (
                seconds === null ||
                seconds === undefined
            ) {
                return "N/A";
            }

            if (seconds < 60) {
                return `${seconds.toFixed(1)} sec`;
            }

            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.round(
                seconds % 60
            );

            return `${minutes} min ${remainingSeconds} sec`;
        }


        function destroyCharts() {
            const charts = [
                rpmChart,
                speedChart,
                throttleChart,
                loadChart,
                coolantChart,
                oilTempChart,
                mafChart,
                mapChart
            ];

            for (const chart of charts) {
                if (chart) {
                    chart.destroy();
                }
            }

            rpmChart = null;
            speedChart = null;
            throttleChart = null;
            loadChart = null;
            coolantChart = null;
            oilTempChart = null;
            mafChart = null;
            mapChart = null;
        }


        function createHistoryChart(
            canvasId,
            label,
            yAxisTitle,
            samples,
            valueKey,
            lineColor
        ) {
            const context =
                document
                    .getElementById(canvasId)
                    .getContext("2d");

            return new Chart(context, {
                type: "line",

                data: {
                    labels: samples.map(
                        sample => sample.sequence
                    ),

                    datasets: [
                        {
                            label: label,
                            data: samples.map(
                                sample => sample[valueKey]
                            ),
                            borderWidth: 2,
                            borderColor: lineColor,
                            backgroundColor: lineColor,
                            pointRadius: 0,
                            tension: 0.2
                        }
                    ]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,

                    plugins: {
                        legend: {
                            display: false
                        }
                    },

                    scales: {
                        x: {
                            ticks: {
                                color: "#9ca3af",
                                maxTicksLimit: 8
                            },

                            grid: {
                                color: "#374151"
                            },

                            title: {
                                display: true,
                                text: "Sequence",
                                color: "#9ca3af"
                            }
                        },

                        y: {
                            beginAtZero: true,

                            ticks: {
                                color: "#9ca3af"
                            },

                            grid: {
                                color: "#374151"
                            },

                            title: {
                                display: false
                            }
                        }
                    }
                }
            });
        }



        function getPlaybackElements() {
            return {
                state: document.getElementById("playback-state"),
                play: document.getElementById("playback-play"),
                pause: document.getElementById("playback-pause"),
                resume: document.getElementById("playback-resume"),
                stop: document.getElementById("playback-stop"),
                speed: document.getElementById("playback-speed"),
                progressFill: document.getElementById(
                    "playback-progress-fill"
                ),
                progressText: document.getElementById(
                    "playback-progress-text"
                ),
                error: document.getElementById("playback-error")
            };
        }


        function renderPlaybackStatus(status) {
            const elements = getPlaybackElements();

            if (!elements.state) {
                return;
            }

            const currentIndex = status.current_index ?? 0;
            const sampleCount = status.sample_count ?? 0;

            let progress = 0;

            if (sampleCount > 0) {
                progress = Math.min(
                    100,
                    (currentIndex / sampleCount) * 100
                );
            }

            elements.progressFill.style.width =
                `${progress}%`;

            elements.progressText.textContent =
                `${currentIndex} / ${sampleCount} samples`;

            elements.error.textContent =
                status.error || "";

            const isSelectedTripActive =
                status.active
                && status.trip_id === selectedTripId;

            const anotherTripActive =
                status.active
                && status.trip_id !== selectedTripId;

            if (status.state === "playing" && isSelectedTripActive) {
                elements.state.textContent =
                    `Playing · ${status.speed}x`;

                elements.play.disabled = true;
                elements.pause.disabled = false;
                elements.resume.disabled = true;
                elements.stop.disabled = false;
                elements.speed.disabled = false;

            } else if (
                status.state === "paused"
                && isSelectedTripActive
            ) {
                elements.state.textContent =
                    `Paused · ${status.speed}x`;

                elements.play.disabled = true;
                elements.pause.disabled = true;
                elements.resume.disabled = false;
                elements.stop.disabled = false;
                elements.speed.disabled = false;

            } else if (anotherTripActive) {
                elements.state.textContent =
                    "Another trip is playing";

                elements.play.disabled = true;
                elements.pause.disabled = true;
                elements.resume.disabled = true;
                elements.stop.disabled = true;
                elements.speed.disabled = true;

            } else {
                elements.state.textContent =
                    currentIndex > 0 && currentIndex === sampleCount
                        ? "Complete"
                        : "Idle";

                elements.play.disabled = false;
                elements.pause.disabled = true;
                elements.resume.disabled = true;
                elements.stop.disabled = true;
                elements.speed.disabled = false;
            }
        }


        async function refreshPlaybackStatus() {
            if (!document.getElementById("playback-state")) {
                return;
            }

            try {
                const response =
                    await fetch("/api/playback/status");

                const status =
                    await response.json();

                renderPlaybackStatus(status);

            } catch (error) {
                const elements = getPlaybackElements();

                if (elements.error) {
                    elements.error.textContent =
                        "Unable to read playback status.";
                }
            }
        }


        async function sendPlaybackRequest(
            url,
            options = {}
        ) {
            const response =
                await fetch(url, options);

            let data = {};

            try {
                data = await response.json();
            } catch (error) {
                data = {};
            }

            if (!response.ok) {
                throw new Error(
                    data.detail
                    || "Playback request failed."
                );
            }

            renderPlaybackStatus(data);

            return data;
        }


        async function startSelectedPlayback() {
            if (!selectedTripId) {
                return;
            }

            const elements = getPlaybackElements();
            const speed = elements.speed.value;

            elements.error.textContent = "";

            try {
                await sendPlaybackRequest(
                    `/api/playback/start/${selectedTripId}?speed=${speed}`,
                    {
                        method: "POST"
                    }
                );

            } catch (error) {
                elements.error.textContent =
                    error.message;
            }
        }


        async function pausePlayback() {
            const elements = getPlaybackElements();

            try {
                await sendPlaybackRequest(
                    "/api/playback/pause",
                    {
                        method: "POST"
                    }
                );

            } catch (error) {
                elements.error.textContent =
                    error.message;
            }
        }


        async function resumePlayback() {
            const elements = getPlaybackElements();

            try {
                await sendPlaybackRequest(
                    "/api/playback/resume",
                    {
                        method: "POST"
                    }
                );

            } catch (error) {
                elements.error.textContent =
                    error.message;
            }
        }


        async function stopPlayback() {
            const elements = getPlaybackElements();

            try {
                await sendPlaybackRequest(
                    "/api/playback/stop",
                    {
                        method: "POST"
                    }
                );

            } catch (error) {
                elements.error.textContent =
                    error.message;
            }
        }


        async function changePlaybackSpeed() {
            const elements = getPlaybackElements();

            try {
                const statusResponse =
                    await fetch("/api/playback/status");

                const status =
                    await statusResponse.json();

                if (!status.active) {
                    return;
                }

                await sendPlaybackRequest(
                    `/api/playback/speed?speed=${elements.speed.value}`,
                    {
                        method: "POST"
                    }
                );

            } catch (error) {
                elements.error.textContent =
                    error.message;
            }
        }


        function bindPlaybackControls(tripId) {
            selectedTripId = tripId;

            const elements = getPlaybackElements();

            elements.play.addEventListener(
                "click",
                startSelectedPlayback
            );

            elements.pause.addEventListener(
                "click",
                pausePlayback
            );

            elements.resume.addEventListener(
                "click",
                resumePlayback
            );

            elements.stop.addEventListener(
                "click",
                stopPlayback
            );

            elements.speed.addEventListener(
                "change",
                changePlaybackSpeed
            );

            if (playbackPollTimer) {
                clearInterval(playbackPollTimer);
            }

            playbackPollTimer = setInterval(
                refreshPlaybackStatus,
                500
            );
        }


        async function loadTrips() {
            const tripList =
                document.getElementById("trip-list");

            try {
                const response =
                    await fetch("/api/trips");

                const trips =
                    await response.json();

                if (!trips.length) {
                    tripList.innerHTML = `
                        <div class="placeholder">
                            No completed trips found.
                        </div>
                    `;

                    return;
                }

                tripList.innerHTML = "";

                for (const trip of trips) {
                    const button =
                        document.createElement("button");

                    button.className = "trip-item";

                    button.innerHTML = `
                        <div class="trip-vehicle">
                            ${formatVehicle(trip.vehicle)}
                        </div>

                        <div class="trip-time">
                            ${formatDateTime(trip.start_time)}
                        </div>

                        <div class="trip-details">
                            ${formatDuration(trip.duration_seconds)}
                            · ${trip.distance_miles ?? "N/A"} mi
                            · ${trip.sample_count ?? 0} samples
                        </div>
                    `;

                    button.addEventListener(
                        "click",
                        function () {
                            document
                                .querySelectorAll(".trip-item")
                                .forEach(
                                    item =>
                                        item.classList.remove("active")
                                );

                            button.classList.add("active");

                            loadTrip(trip.trip_id);
                        }
                    );

                    tripList.appendChild(button);
                }

            } catch (error) {
                tripList.innerHTML = `
                    <div class="placeholder">
                        Unable to load trip history.
                    </div>
                `;
            }
        }


        async function loadTrip(tripId) {
            selectedTripId = tripId;

            const detail =
                document.getElementById("trip-detail");

            detail.innerHTML = `
                <div class="placeholder">
                    Loading trip...
                </div>
            `;

            try {
                const response =
                    await fetch(
                        `/api/trips/${tripId}`
                    );

                if (!response.ok) {
                    throw new Error(
                        "Trip could not be loaded."
                    );
                }

                const trip =
                    await response.json();

                renderTrip(
                    trip.trip_id,
                    trip.metadata,
                    trip.samples,
                    trip.events || []
                );

            } catch (error) {
                detail.innerHTML = `
                    <div class="placeholder">
                        Unable to load this trip.
                    </div>
                `;
            }
        }



        function formatElapsedSeconds(seconds) {
            if (
                seconds === null ||
                seconds === undefined ||
                Number.isNaN(seconds)
            ) {
                return null;
            }

            const safeSeconds =
                Math.max(0, Math.round(seconds));

            const minutes =
                Math.floor(safeSeconds / 60);

            const remainingSeconds =
                safeSeconds % 60;

            return (
                String(minutes).padStart(2, "0")
                + ":"
                + String(remainingSeconds).padStart(2, "0")
            );
        }


        function computeElapsedLabel(
            eventTimestamp,
            tripStartTimestamp
        ) {
            if (!eventTimestamp || !tripStartTimestamp) {
                return null;
            }

            const elapsedMs =
                new Date(eventTimestamp)
                - new Date(tripStartTimestamp);

            if (Number.isNaN(elapsedMs)) {
                return null;
            }

            return formatElapsedSeconds(elapsedMs / 1000);
        }


        function formatFieldValue(field, value) {
            if (value === null || value === undefined) {
                return "N/A";
            }

            const meta = TELEMETRY_FIELD_META[field];
            const unit = meta ? meta.unit : "";

            return `${value}${unit}`;
        }


        function formatFieldLabel(field) {
            const meta = TELEMETRY_FIELD_META[field];

            return meta ? meta.label : (field ?? "Value");
        }


        function pairAlarmEvents(events) {
            const sorted = [...events].sort((a, b) => {
                const aKey = a.sequence ?? 0;
                const bKey = b.sequence ?? 0;

                return aKey - bKey;
            });

            const openByRule = new Map();
            const groups = [];

            for (const event of sorted) {
                const ruleName = event.rule ?? "Alarm";

                if (event.type === "cleared") {
                    const open = openByRule.get(ruleName);

                    if (open) {
                        open.cleared = event;
                        openByRule.delete(ruleName);
                        continue;
                    }

                    groups.push({
                        rule: ruleName,
                        triggered: null,
                        cleared: event
                    });

                    continue;
                }

                const group = {
                    rule: ruleName,
                    triggered: event,
                    cleared: null
                };

                openByRule.set(ruleName, group);
                groups.push(group);
            }

            return groups;
        }


        function renderAlarmGroup(group, tripStartTime) {
            const primary =
                group.triggered || group.cleared;

            const severity =
                (primary.severity || "warning").toLowerCase();

            const resolved = Boolean(group.cleared);

            const containerClass =
                resolved ? "cleared" : "triggered";

            const badgeClass =
                severity === "critical"
                    ? "critical"
                    : "warning";

            const phases = [];

            if (group.triggered) {
                const event = group.triggered;

                const elapsed =
                    computeElapsedLabel(
                        event.timestamp,
                        tripStartTime
                    );

                const requirement =
                    event.duration_requirement_seconds;

                phases.push(`
                    <div class="alarm-event-phase">
                        <span class="alarm-event-phase-label">
                            Triggered
                        </span>
                        ${
                            elapsed
                                ? ` at ${elapsed}`
                                : ""
                        }
                        <br>
                        ${formatFieldLabel(event.field)}:
                        ${formatFieldValue(
                            event.field,
                            event.value
                        )}
                        (${event.operator ?? ""}
                        ${formatFieldValue(
                            event.field,
                            event.threshold
                        )})
                        ${
                            requirement !== null
                            && requirement !== undefined
                                ? `<br>Duration requirement: `
                                    + `${requirement} sec`
                                : ""
                        }
                    </div>
                `);
            }

            if (group.cleared) {
                const event = group.cleared;

                const elapsed =
                    computeElapsedLabel(
                        event.timestamp,
                        tripStartTime
                    );

                phases.push(`
                    <div class="alarm-event-phase">
                        <span class="alarm-event-phase-label">
                            Cleared
                        </span>
                        ${
                            elapsed
                                ? ` at ${elapsed}`
                                : ""
                        }
                        <br>
                        Active: ${formatDuration(
                            event.duration_seconds ?? 0
                        )}
                    </div>
                `);
            } else if (group.triggered) {
                phases.push(`
                    <div class="alarm-event-phase">
                        <span class="alarm-event-phase-label">
                            Still active
                        </span>
                        at end of trip
                    </div>
                `);
            }

            return `
                <div class="alarm-event ${containerClass}">
                    <div class="alarm-event-top">
                        <div>
                            <span class="alarm-event-title">
                                ${group.rule}
                            </span>
                            <span class="alarm-badge ${badgeClass}">
                                ${severity}
                            </span>
                        </div>
                    </div>
                    <div class="alarm-event-meta">
                        ${phases.join("")}
                    </div>
                </div>
            `;
        }


        function renderAlarmTimeline(events, tripStartTime) {
            const alarmList =
                document.getElementById("alarm-list");

            if (!alarmList) {
                return;
            }

            if (!events || !events.length) {
                alarmList.innerHTML = `
                    <div class="placeholder">
                        No alarm events recorded for this trip.
                    </div>
                `;
                return;
            }

            const groups = pairAlarmEvents(events);

            alarmList.innerHTML = groups
                .map(
                    group =>
                        renderAlarmGroup(
                            group,
                            tripStartTime
                        )
                )
                .join("");
        }


        function buildSampleIndexLookups(samples) {
            const bySequence = new Map();
            const byTimestamp = new Map();

            samples.forEach((sample, index) => {
                if (
                    sample.sequence !== null
                    && sample.sequence !== undefined
                    && !bySequence.has(sample.sequence)
                ) {
                    bySequence.set(sample.sequence, index);
                }

                if (
                    sample.timestamp
                    && !byTimestamp.has(sample.timestamp)
                ) {
                    byTimestamp.set(sample.timestamp, index);
                }
            });

            return { bySequence, byTimestamp };
        }


        function resolveSampleIndex(event, lookups) {
            if (
                event.sequence !== null
                && event.sequence !== undefined
                && lookups.bySequence.has(event.sequence)
            ) {
                return lookups.bySequence.get(event.sequence);
            }

            if (
                event.timestamp
                && lookups.byTimestamp.has(event.timestamp)
            ) {
                return lookups.byTimestamp.get(event.timestamp);
            }

            return null;
        }


        function groupEventsByField(events) {
            const grouped = {};

            for (const event of events) {
                if (!event.field) {
                    continue;
                }

                if (!grouped[event.field]) {
                    grouped[event.field] = [];
                }

                grouped[event.field].push(event);
            }

            return grouped;
        }


        function formatAlarmTooltipLines(event, tripStartTime) {
            const elapsed =
                computeElapsedLabel(
                    event.timestamp,
                    tripStartTime
                );

            if (event.type === "cleared") {
                return [
                    `${event.rule ?? "Alarm"} cleared`
                        + (elapsed ? ` at ${elapsed}` : ""),
                    `Active: ${formatDuration(
                        event.duration_seconds ?? 0
                    )}`
                ];
            }

            return [
                `${event.rule ?? "Alarm"} triggered`
                    + (elapsed ? ` at ${elapsed}` : ""),
                `${formatFieldLabel(event.field)}: `
                    + `${formatFieldValue(
                        event.field,
                        event.value
                    )} `
                    + `(${event.operator ?? ""}`
                    + `${formatFieldValue(
                        event.field,
                        event.threshold
                    )})`
            ];
        }


        function applyAlarmMarkers(
            chart,
            samples,
            fieldEvents,
            tripStartTime
        ) {
            if (!chart || !fieldEvents || !fieldEvents.length) {
                return;
            }

            const lookups = buildSampleIndexLookups(samples);
            const dataLength = samples.length;

            const baseColor =
                chart.data.datasets[0].borderColor;

            const pointRadius = new Array(dataLength).fill(0);
            const pointHoverRadius = new Array(dataLength).fill(3);
            const pointBackgroundColor =
                new Array(dataLength).fill(baseColor);
            const pointBorderColor =
                new Array(dataLength).fill(baseColor);
            const pointBorderWidth = new Array(dataLength).fill(0);

            const markersByIndex = new Map();

            for (const event of fieldEvents) {
                const index = resolveSampleIndex(event, lookups);

                if (index === null) {
                    continue;
                }

                const isCleared = event.type === "cleared";

                pointRadius[index] = 6;
                pointHoverRadius[index] = 8;
                pointBackgroundColor[index] =
                    isCleared ? "#10b981" : "#f59e0b";
                pointBorderColor[index] = "#111827";
                pointBorderWidth[index] = 2;

                if (!markersByIndex.has(index)) {
                    markersByIndex.set(index, []);
                }

                markersByIndex.get(index).push(event);
            }

            if (markersByIndex.size === 0) {
                return;
            }

            chart.data.datasets[0].pointRadius = pointRadius;
            chart.data.datasets[0].pointHoverRadius =
                pointHoverRadius;
            chart.data.datasets[0].pointBackgroundColor =
                pointBackgroundColor;
            chart.data.datasets[0].pointBorderColor =
                pointBorderColor;
            chart.data.datasets[0].pointBorderWidth =
                pointBorderWidth;

            chart.options.plugins = chart.options.plugins || {};
            chart.options.plugins.tooltip =
                chart.options.plugins.tooltip || {};
            chart.options.plugins.tooltip.callbacks =
                chart.options.plugins.tooltip.callbacks || {};

            chart.options.plugins.tooltip.callbacks.afterLabel =
                function (context) {
                    const marker =
                        markersByIndex.get(context.dataIndex);

                    if (!marker) {
                        return undefined;
                    }

                    return marker
                        .map(
                            event =>
                                formatAlarmTooltipLines(
                                    event,
                                    tripStartTime
                                )
                        )
                        .flat();
                };

            chart.update("none");
        }


        function applyAlarmMarkersToTripCharts(
            events,
            samples,
            tripStartTime,
            chartsByCanvasId
        ) {
            const eventsByField = groupEventsByField(events || []);

            for (const [field, fieldEvents] of Object.entries(
                eventsByField
            )) {
                const meta = TELEMETRY_FIELD_META[field];

                if (!meta) {
                    continue;
                }

                const chart = chartsByCanvasId[meta.canvasId];

                if (!chart) {
                    continue;
                }

                applyAlarmMarkers(
                    chart,
                    samples,
                    fieldEvents,
                    tripStartTime
                );
            }
        }

            `;

            renderAlarmTimeline(

            bindPlaybackControls(tripId);

            rpmChart = createHistoryChart(

            speedChart = createHistoryChart(

            const chartsByCanvasId = {

                "load-history-chart": loadChart,
                "coolant-history-chart": coolantChart,

        }
